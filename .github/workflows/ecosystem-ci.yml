            ref: a656a33b080a5c1f64b01e841daad76f35f5ec5f
          - id: indico
            repository: indico/indico
            ref: 9fadd1dd6e1494a01081c459ff476d0b48001641
          - id: parabol
            repository: ParabolInc/parabol
            ref: 21310c943c4c7161bce2961488c96878632da5f2
          - id: carbon
            repository: crbnos/carbon
            ref: 7f5f1d2145b1ab7f0788f253ea8f6f97d0be3b17
          - id: c15t
            repository: c15t/c15t
            ref: ce5e35261aa922d7ff3d2d0c73402db16ca01eb9
          - id: opentogethertube
            repository: dyc3/opentogethertube
            ref: 4e3f7a4ec68a0e0613de3622c340f898c9806d4b
          - id: prisma-next
            repository: prisma/prisma-next
            ref: 55458c441d2cf452028c22eed21370447720840a
          - id: liam
            repository: liam-hq/liam
            ref: c89f31d455cd8a5518e3920d8ada6605544cce31
          - id: byline-cms
            repository: Byline-CMS/bylinecms.dev
            ref: c27ada93adff84c0155553d8fee1de5fdff237a4
          - id: poketernity
            repository: Despair-Games/poketernity
            ref: 7fb6d12a13d528a1b70536a1a3150dd6b7049daa

    name: Test ${{ matrix.id }}
    needs: build-biome
    timeout-minutes: 15
    runs-on: depot-ubuntu-24.04-arm-16
    steps:
      - name: Record job start
        id: job-start
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" >> "$GITHUB_OUTPUT"

      - name: Download Biome binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: biome
          path: bin/

      - run: |
          chmod +x bin/biome
          echo "$GITHUB_WORKSPACE/bin" >> $GITHUB_PATH

      - name: Checkout ${{ matrix.repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          sparse-checkout: ${{ matrix.working-directory }}
          ref: ${{ matrix.ref }}
          path: repository

      - name: Record repository commit
        id: repository-metadata
        working-directory: repository
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Migrate
        id: migrate
        working-directory: repository/${{ matrix.working-directory }}
        run: |
          if ! biome migrate --write; then
            outcome=failed
          elif [[ -n "$(git status --porcelain)" ]]; then
            outcome=succeeded_with_changes
          else
            outcome=succeeded_no_changes
          fi
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"

      - name: Run Biome check and generate report
        if: ${{ ! cancelled() }}
        id: test
        working-directory: repository/${{ matrix.working-directory }}
        env:
          CHECK_SAMPLES: 5
        run: |
          # Define report file path
          REPORT_FILE="$GITHUB_WORKSPACE/biome-report-${{ matrix.id }}.json"
          REPETITION_FILE="$REPORT_FILE.repetition"

          # Every repetition runs the identical command with the JSON reporter to a
          # file (the diagnostic limit is lifted for non-default reporters). The last
          # valid repetition becomes the published raw report and decides the outcome.
          samples='[]'
          first_diagnostics=''
          OUTCOME_EXIT_CODE=''

          for ((ordinal = 1; ordinal <= CHECK_SAMPLES; ordinal++)); do
            rm -f "$REPETITION_FILE"
            set +e
            biome check --error-on-warnings --reporter=json --reporter-file="$REPETITION_FILE" ${{ matrix.arguments || '.' }}
            BIOME_EXIT_CODE=$?
            set -e

            if [ ! -s "$REPETITION_FILE" ]; then
              echo "::warning::Repetition $ordinal produced no report (exit code $BIOME_EXIT_CODE)"
              continue
            fi
            sample=$(jq -ce --argjson ordinal "$ordinal" '
              select((.summary.duration | type) == "number" and (.summary.scannerDuration | type) == "number")
              | {ordinal: $ordinal, checkDurationNs: .summary.duration, scannerDurationNs: .summary.scannerDuration}
            ' "$REPETITION_FILE") || {
              echo "::warning::Repetition $ordinal produced a report without timings (exit code $BIOME_EXIT_CODE)"
              continue
            }
            samples=$(jq -c --argjson sample "$sample" '. + [$sample]' <<< "$samples")
            mv "$REPETITION_FILE" "$REPORT_FILE"
            OUTCOME_EXIT_CODE=$BIOME_EXIT_CODE
            echo "Repetition $ordinal: check $(jq -r '.checkDurationNs / 1e6 | floor' <<< "$sample") ms, scanner $(jq -r '.scannerDurationNs / 1e6 | floor' <<< "$sample") ms, exit code $BIOME_EXIT_CODE"

            # Repetitions must agree on what they found; a difference means non-determinism.
            diagnostics=$(jq '.diagnostics | length' "$REPORT_FILE")
            if [ -z "$first_diagnostics" ]; then
              first_diagnostics=$diagnostics
            elif [ "$diagnostics" != "$first_diagnostics" ]; then
              echo "::warning::Repetition $ordinal reported $diagnostics diagnostics but the first valid repetition reported $first_diagnostics"
            fi
          done
          rm -f "$REPETITION_FILE"

          echo "timing_samples=$samples" >> "$GITHUB_OUTPUT"
          echo "Collected $(jq 'length' <<< "$samples") timing samples"

          # Set outcome based on the exit code of the repetition that produced the report
          if [ "$OUTCOME_EXIT_CODE" = "0" ]; then
            echo "outcome=success" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=failure" >> "$GITHUB_OUTPUT"
          fi

          # Debug: Check if file was created
          echo "Checking report file: $REPORT_FILE"
          if [ -f "$REPORT_FILE" ]; then
            FILE_SIZE=$(wc -c < "$REPORT_FILE")
            echo "Report file exists, size: $FILE_SIZE bytes"
            if [ $FILE_SIZE -gt 0 ]; then
              echo "First 200 chars:"
              head -c 200 "$REPORT_FILE" || true
            fi
          else
            echo "ERROR: Report file was not created by Biome!"
          fi

          # If the report file doesn't exist or is empty, create error placeholder
          if [ ! -f "$REPORT_FILE" ] || [ ! -s "$REPORT_FILE" ]; then
            echo "Creating error placeholder because file is missing or empty"
            echo '{"error": true}' > "$REPORT_FILE"
          fi

      - name: Upload Biome report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          retention-days: ${{ (! inputs.biome-ref || inputs.biome-ref == 'main') && 10 || 1 }}
          name: ${{ (! inputs.biome-ref || inputs.biome-ref == 'main') && format('biome-report-{0}', matrix.id) || format('candidate-report-{0}', matrix.id) }}
          path: ${{ github.workspace }}/biome-report-${{ matrix.id }}.json

      - name: Save target metadata
        if: ${{ always() && steps.repository-metadata.outputs.commit_sha != '' }}
        env:
          TARGET_ID: ${{ matrix.id }}
          REPOSITORY_SLUG: ${{ matrix.repository }}
          REPOSITORY_COMMIT_SHA: ${{ steps.repository-metadata.outputs.commit_sha }}
          JOB_STARTED_AT: ${{ steps.job-start.outputs.started_at }}
          MIGRATION_OUTCOME: ${{ steps.migrate.outputs.outcome }}
          CHECK_OUTCOME: ${{ steps.test.outputs.outcome }}
          TIMING_SAMPLES: ${{ steps.test.outputs.timing_samples }}
        run: |
          execution_status=completed
          if [[ -z "$CHECK_OUTCOME" ]]; then
            execution_status=error
          fi
          jq -n \
            --arg id "$TARGET_ID" \
            --arg repositorySlug "$REPOSITORY_SLUG" \
            --arg repositoryCommitSha "$REPOSITORY_COMMIT_SHA" \
            --arg jobStartedAt "$JOB_STARTED_AT" \
            --arg jobCompletedAt "$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" \
            --arg migrationOutcome "${MIGRATION_OUTCOME:-not_run}" \
            --arg executionStatus "$execution_status" \
            --argjson timingSamples "${TIMING_SAMPLES:-[]}" \
            '{id: $id, repositorySlug: $repositorySlug, repositoryCommitSha: $repositoryCommitSha, jobStartedAt: $jobStartedAt, jobCompletedAt: $jobCompletedAt, migrationOutcome: $migrationOutcome, executionStatus: $executionStatus, timingSamples: $timingSamples}' \
            > "target-metadata-$TARGET_ID.json"

      - name: Upload target metadata
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: ignore
          retention-days: 1
          name: target-metadata-${{ matrix.id }}
          path: target-metadata-${{ matrix.id }}.json

      - name: Save outcome JSON
        run: |
          echo '{"id": "${{ matrix.id }}", "outcome": "${{ steps.test.outputs.outcome }}"}' > "$GITHUB_WORKSPACE/outcome-${{ matrix.id }}.json"

      - name: Upload outcome
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          retention-days: 1
          name: outcome-${{ matrix.id }}
          path: ${{ github.workspace }}/outcome-${{ matrix.id }}.json

  publish-dashboard-data:
    name: Publish dashboard data
    if: ${{ always() && !cancelled() }}
    needs:
      - build-biome
      - test-ecosystem
    runs-on: depot-ubuntu-24.04-arm-16
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare artifact directories
        run: mkdir -p published-reports target-metadata

      - name: Download report artifacts
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-report-*"
          path: published-reports/
          merge-multiple: true

      - name: Download target metadata
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: target-metadata-*
          path: target-metadata/
          merge-multiple: true

      - name: Publish reports and run manifest
        env:
          ECOSYSTEM_CI_UPLOAD_TOKEN: ${{ secrets.ECOSYSTEM_CI_UPLOAD_TOKEN }}
        run: |
          pnpm --dir dashboard exec tsx scripts/publish-run.ts \
            --reports-dir ../published-reports \
            --metadata-dir ../target-metadata \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --biome-branch "${{ inputs.biome-ref || 'main' }}" \
            --biome-commit-sha "${{ needs.build-biome.outputs.biome_commit_sha }}" \
            --started-at "${{ needs.build-biome.outputs.started_at }}" \
            --completed-at "$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)"

  notify-discord:
    name: Notify Discord
    needs: test-ecosystem
    runs-on: depot-ubuntu-24.04-arm-16
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Download all outcome artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: outcome-*
          path: outcomes/
          merge-multiple: true

      - name: Download all biome report artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-report-*"
          path: reports/
          merge-multiple: true

      - name: Download previous biome report artifacts
        uses: dawidd6/action-download-artifact@d63b86af1b34672e53c440b1b83979861906bad7 # v24
        with:
          workflow_conclusion: completed
          search_artifacts: true
          if_no_artifact_found: warn
          name_is_regexp: true
          name: ^biome-report-.*$
          path: previous-reports/
          skip_unpack: false

      - name: Aggregate results
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node --experimental-strip-types scripts/index.ts \
            --outcomes-dir outcomes \
            --reports-dir reports \
            --previous-reports-dir previous-reports \
            --biome-ref "${{ inputs.biome-ref || 'main' }}" \
            --run-url "$RUN_URL" \
            --json > discord-messages.json

      - name: Send Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node --experimental-strip-types scripts/send-discord-messages.ts discord-messages.json
