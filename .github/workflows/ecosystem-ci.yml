name: Biome Ecosystem CI

permissions:
  contents: none

on:
  schedule:
    - cron: "0 5 * * 1,3,5" # monday,wednesday,friday 5AM

  workflow_dispatch:
    inputs:
      biome-ref:
        description: biomejs/biome reference to checkout
        type: string
        default: main

jobs:
  build-biome:
    name: Build Biome (${{ inputs.biome-ref || 'main' }})
    timeout-minutes: 20
    runs-on: depot-ubuntu-24.04-arm-64
    outputs:
      biome_commit_sha: ${{ steps.biome-metadata.outputs.commit_sha }}
      started_at: ${{ steps.run-start.outputs.started_at }}
    steps:
      - name: Record run start
        id: run-start
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" >> "$GITHUB_OUTPUT"

      - name: Checkout Biome
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: biomejs/biome
          ref: ${{ inputs.biome-ref }}

      - name: Record Biome commit
        id: biome-metadata
        run: echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install toolchain
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3
        with:
          cache-target: release
          cache-base: main

      - name: Build Biome binary
        env:
          # We set `BIOME_VERSION` to disable the recommended rules from the nursery group
          # The version needs to be different from 0.0.0
          BIOME_VERSION: 0.0.1
          RUSTFLAGS: -C debug-assertions
        run: |
          cargo build --bin biome --release

      - name: Upload Biome binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          retention-days: 10
          name: biome
          path: ./target/release/biome

  test-ecosystem:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Add projects to test here
          # Supported fields:
          # - id: identifier
          # - repository: GitHub repository to checkout
          # - ref: ref to checkout (default is the default branch)
          # - working-directory: where to execute `biome` (default is the root of the repository)
          #   The path is relative to the root of the repository
          # - arguments: extra arguments to pass to the `biome check` command (default is `.`)
          - id: django
            repository: django/django
            ref: 73cc09f14f13fedddc14d6ba5b287cb33c24e4a4
          - id: cline
            repository: cline/cline
            ref: 48d63852745460ff0fa3dfcc0457bbe2493841de
          - id: astro
            repository: withastro/astro
            ref: 19dae210d42bd22662ee678c173676573b6168f2
          - id: cherry-studio
            repository: CherryHQ/cherry-studio
            ref: f24fc324a7a4932284e4cadb96944d29980cbcf4
          - id: novu
            repository: novuhq/novu
            ref: 80ebaa666ed74333e85d6c62199d209a8fe77dc7
          - id: discordjs
            repository: discordjs/discord.js
            ref: 10f059e3ca0d3b1c9024da0e1baa81a795288230
          - id: promptfoo
            repository: promptfoo/promptfoo
            ref: 9cd19241a0706fcf59dd609167f4218612fc4beb
          - id: eliza
            repository: elizaOS/eliza
            ref: 29bed1bb394a2c0c7c0df6dc12babbe28667efbe
          - id: react-native-vector-icons
            repository: oblador/react-native-vector-icons
            ref: 9406d84ac61bb152b0e38c1a9cb4f389d1623503
          - id: vercel
            repository: vercel/vercel
            ref: e06cc643cec6a47bd9344af7f4589c736d95ed15
          - id: midday
            repository: midday-ai/midday
            ref: 51587319f26a0ffaa9dfccab1920373cb65689b7
          - id: coder
            repository: coder/coder
            ref: d6b67e8e31574d8164f3a33330c103a07e16dc19
          - id: ten-framework
            repository: TEN-framework/ten-framework
            ref: 84ad09df7883f98a8eb446aa34bdf22ff96c64a9
          - id: typebot
            repository: baptisteArno/typebot.io
            ref: 4bc37a4b5befe07de1739f5d52d8d1e7c05dcc9b
          - id: coss
            repository: cosscom/coss
            ref: 4ebe375c04cc574dc2eaade2380b3cf9a48fceaa
          - id: superset
            repository: superset-sh/superset
            ref: bfc68940b1b10bce61a435a8957101b3b9d06b04
          - id: fast
            repository: microsoft/fast
            ref: a909e87e5b2d5da069469823e9665553a8a5a325
          - id: react-native-vision-camera
            repository: mrousavy/react-native-vision-camera
            ref: 91bae1f08d549b50444ee16661dc4f4375cba0b6
          - id: nhost
            repository: nhost/nhost
            ref: 5d11ad32ea3c6d5c1a7d0575443911bfbeb38518
          - id: podman-desktop
