            ref: 862898c855693ff066f5df9414debc1b1f4308f5
          - id: rivet
            repository: rivet-dev/rivet
            ref: b5cac54a50103c0739b618f519ce32778119c3b4
          - id: ark
            repository: chakra-ui/ark
            ref: d1af1a6419bfc6f088fb8f6f572da8e7acf408f1
          - id: modern-js
            repository: web-infra-dev/modern.js
            ref: 2f4d9c4559e26209a0d77f02c6757f29fe3699a2
          - id: FluidFramework
            repository: microsoft/FluidFramework
            ref: ac7d1a3bfc9fd5da9a459549286562f23e56096e
          - id: freelens
            repository: freelensapp/freelens
            ref: db7bc60a596aa645b5a334b167aec910a6356274
          - id: epicenter
            repository: EpicenterHQ/epicenter
            ref: 72e9f272adc7e21a9cdeb0dcfa00e1009ba156ed
          - id: pollinations
